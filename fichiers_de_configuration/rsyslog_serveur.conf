# ==============================================================================
# rsyslog_serveur.conf — Configuration du serveur de centralisation des logs
# Projet 3 : Supervision et Gestion des Logs
# Auteur   : Étudiant Ingénierie Système
# Date     : 2026-05-17
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MODULES DE BASE
# ------------------------------------------------------------------------------

# Module de journalisation standard
$ModLoad imuxsock        # Logs depuis le système local (socket Unix)
$ModLoad imklog          # Logs du noyau (kernel)

# Module de réception UDP (port 514 par défaut)
$ModLoad imudp
$UDPServerRun 514

# Module de réception TCP (connexion fiable, recommandée)
$ModLoad imtcp
$InputTCPServerRun 514

# ------------------------------------------------------------------------------
# 2. FORMAT ET HORODATAGE
# ------------------------------------------------------------------------------

# Format des messages (RFC 3164 compatible)
$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# Horodatage haute précision
$template RFC3339Format,"%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n"

# ------------------------------------------------------------------------------
# 3. RÉPERTOIRE DE STOCKAGE CENTRALISÉ
# ------------------------------------------------------------------------------

# Créer un répertoire par hôte distant pour cloisonner les logs
$template DynamicLogs,"/var/log/clients/%HOSTNAME%/%PROGRAMNAME%.log"

# Règle : écrire tous les logs reçus dans le répertoire dynamique
*.* ?DynamicLogs

# ------------------------------------------------------------------------------
# 4. SÉCURITÉ ET PERMISSIONS
# ------------------------------------------------------------------------------

# Restreindre la création de fichiers (owner rsyslog, groupe adm)
$FileOwner rsyslog
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0750
$Umask 0022
$PrivDropToUser rsyslog
$PrivDropToGroup rsyslog

# ------------------------------------------------------------------------------
# 5. RÈGLES DE JOURNALISATION LOCALE (SERVEUR LUI-MÊME)
# ------------------------------------------------------------------------------

# Urgences → tous les terminaux
*.emerg                         :omusrmsg:*

# Authentification → fichier dédié
auth,authpriv.*                 /var/log/auth.log

# Messages noyau → console
kern.*                          /dev/console

# Tous les services → syslog global
*.*;auth,authpriv.none          -/var/log/syslog

# Démon rsyslog lui-même
$ModLoad omfile
syslog.*                        /var/log/rsyslog.log

# ==============================================================================
# FIN DE CONFIGURATION SERVEUR
# ==============================================================================
