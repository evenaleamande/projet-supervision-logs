# ==============================================================================
# rsyslog_client.conf — Configuration du client qui envoie ses logs au serveur
# Projet 3 : Supervision et Gestion des Logs
# Auteur   : Étudiant Ingénierie Système
# Date     : 2026-05-17
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. MODULES DE BASE (côté client)
# ------------------------------------------------------------------------------

$ModLoad imuxsock    # Logs depuis applications locales
$ModLoad imklog      # Logs noyau

# ------------------------------------------------------------------------------
# 2. FORMAT DES MESSAGES
# ------------------------------------------------------------------------------

$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat

# ------------------------------------------------------------------------------
# 3. RÈGLES D'ENVOI VERS LE SERVEUR DISTANT
# ------------------------------------------------------------------------------

# Adresse IP du serveur centralisateur (à adapter selon votre réseau)
# Syntaxe UDP :  @IP_SERVEUR:PORT   (moins fiable, léger)
# Syntaxe TCP :  @@IP_SERVEUR:PORT  (fiable, recommandé en production)

# --- Option A : envoi UDP simple ---
# *.* @192.168.1.100:514

# --- Option B : envoi TCP avec queue (RECOMMANDÉ) ---
# En cas de perte de connexion, les logs sont mis en file d'attente localement
$WorkDirectory /var/spool/rsyslog

$ActionQueueType LinkedList          # File chaînée en mémoire
$ActionQueueFileName client_fwd_q   # Fichier de persistance sur disque
$ActionQueueMaxDiskSpace 100m        # Taille max de la queue sur disque
$ActionQueueSaveOnShutdown on        # Sauvegarde au redémarrage
$ActionResumeRetryCount -1           # Réessais infinis si serveur indisponible

# Envoi de TOUS les niveaux de logs vers le serveur via TCP
*.* @@192.168.1.100:514

# ------------------------------------------------------------------------------
# 4. RÈGLES LOCALES (garder une copie locale en parallèle)
# ------------------------------------------------------------------------------

# Urgences → tous les terminaux
*.emerg                         :omusrmsg:*

# Authentification → fichier local
auth,authpriv.*                 /var/log/auth.log

# Logs système locaux (sans auth)
*.*;auth,authpriv.none          -/var/log/syslog

# Logs du daemon (cron, etc.)
daemon.*                        -/var/log/daemon.log

# Logs noyau
kern.*                          -/var/log/kern.log

# Messages de l'utilisateur
user.*                          -/var/log/user.log

# ==============================================================================
# FIN DE CONFIGURATION CLIENT
# ==============================================================================
