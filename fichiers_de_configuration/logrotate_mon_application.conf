# ==============================================================================
# logrotate_mon_application.conf — Rotation des logs de l'application
# Projet 3 : Supervision et Gestion des Logs
# Auteur   : Étudiant Ingénierie Système
# Date     : 2026-05-17
#
# Emplacement : /etc/logrotate.d/mon_application
# ==============================================================================

# ------------------------------------------------------------------------------
# SECTION 1 : Rotation du log principal de l'application
# ------------------------------------------------------------------------------
/var/log/mon_application/app.log {

    # Fréquence de rotation
    daily                   # Rotation chaque jour

    # Conservation des archives
    rotate 14               # Garder 14 fichiers archivés (2 semaines)

    # Compression
    compress                # Compresser les anciens fichiers (gzip)
    delaycompress           # Ne pas compresser le fichier de la rotation précédente
                            # (utile si l'application garde le descripteur ouvert)

    # Gestion des fichiers manquants
    missingok               # Ne pas signaler d'erreur si le fichier est absent
    notifempty              # Ne pas effectuer de rotation si le fichier est vide

    # Création du nouveau fichier log après rotation
    create 0640 www-data adm  # Permissions, propriétaire, groupe

    # Horodatage dans le nom d'archive (ex: app.log-20260517.gz)
    dateext
    dateformat -%Y%m%d

    # Partage du fichier de statut (utile si plusieurs règles utilisent logrotate)
    sharedscripts

    # Script exécuté AVANT la rotation
    prerotate
        echo "[$(date)] Début de la rotation du log app.log" >> /var/log/logrotate_audit.log
    endscript

    # Script exécuté APRÈS la rotation (recharger l'application pour qu'elle
    # ouvre le nouveau fichier)
    postrotate
        # Envoyer SIGHUP au processus de l'application pour rouvrir ses fichiers
        if [ -f /var/run/mon_application.pid ]; then
            kill -HUP $(cat /var/run/mon_application.pid)
        fi
        echo "[$(date)] Rotation terminée — nouveau fichier créé" >> /var/log/logrotate_audit.log
    endscript
}

# ------------------------------------------------------------------------------
# SECTION 2 : Rotation des logs d'erreur de l'application
# ------------------------------------------------------------------------------
/var/log/mon_application/error.log {

    weekly                  # Rotation hebdomadaire
    rotate 8                # Conserver 8 semaines d'archives

    compress
    delaycompress
    missingok
    notifempty

    create 0640 www-data adm
    dateext
    dateformat -%Y%m%d

    # Pas de reload nécessaire pour les erreurs (fichier partagé avec app.log)
    sharedscripts

    postrotate
        if [ -f /var/run/mon_application.pid ]; then
            kill -HUP $(cat /var/run/mon_application.pid)
        fi
    endscript
}

# ------------------------------------------------------------------------------
# SECTION 3 : Rotation des logs d'accès (format type access.log)
# ------------------------------------------------------------------------------
/var/log/mon_application/access.log {

    daily
    rotate 30               # Conserver 30 jours (1 mois)

    compress
    delaycompress
    missingok
    notifempty

    create 0640 www-data adm
    dateext
    dateformat -%Y%m%d

    # Taille maximale : rotation si le fichier dépasse 100 Mo (même avant la date)
    size 100M

    sharedscripts

    postrotate
        if [ -f /var/run/mon_application.pid ]; then
            kill -HUP $(cat /var/run/mon_application.pid)
        fi
    endscript
}

# ==============================================================================
# NOTES D'UTILISATION
# ==============================================================================
# Tester la configuration (simulation, sans rotation réelle) :
#   sudo logrotate --debug /etc/logrotate.d/mon_application
#
# Forcer une rotation immédiate (ignorer la fréquence configurée) :
#   sudo logrotate --force /etc/logrotate.d/mon_application
#
# Vérifier le fichier de statut logrotate :
#   cat /var/lib/logrotate/status
# ==============================================================================
